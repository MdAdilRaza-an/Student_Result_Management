<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Marks | Student Result Management</title>
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="sidebar-header"><h2>SRMS</h2></div>
        <nav class="nav-menu">
          <a class="nav-link" href="dashboard.html">Dashboard</a>
          <a class="nav-link" href="students.html">Students</a>
          <a class="nav-link" href="subjects.html">Subjects</a>
          <a class="nav-link active" href="marks.html">Marks</a>
          <a class="nav-link" href="results.html">Results</a>
        </nav>
      </aside>

      <main class="main-content">
        <div class="topbar">
          <h1>Marks Management</h1>
          <div class="user-actions">
            <span id="adminName" class="user-badge">Admin</span>
            <button id="logoutBtn" class="secondary-btn">Logout</button>
          </div>
        </div>

        <div class="page-card">
          <form id="marksForm" class="grid-form">
            <div class="form-group"><label>Student</label><select id="studentSelect" required></select></div>
            <div class="form-group"><label>Subject</label><select id="subjectSelect" required></select></div>
            <div class="form-group"><label>Obtained Marks</label><input id="marksObtained" type="number" min="0" step="0.01" required /></div>
            <div class="form-group" style="display:flex; align-items:flex-end;"><button type="submit" class="primary-btn">Save Marks</button></div>
          </form>

          <div id="marksMessage" class="message"></div>
          <div class="table-wrap"><table><thead><tr><th>Student</th><th>Roll No</th><th>Subject</th><th>Marks Obtained</th><th>Max Marks</th><th>Percentage</th><th>Actions</th></tr></thead><tbody id="marksTableBody"></tbody></table></div>
        </div>
      </main>
    </div>

    <script src="./config.js"></script>
    <script src="./js/auth.js"></script>
    <script>
      redirectIfNotAuthenticated();
      const adminNameEl = document.getElementById('adminName');
      const admin = JSON.parse(localStorage.getItem('student_result_admin') || '{}');
      if (admin.name) adminNameEl.textContent = admin.name;

      document.getElementById('logoutBtn').addEventListener('click', () => {
        clearAuthToken();
        localStorage.removeItem('student_result_admin');
        window.location.href = 'index.html';
      });

      async function loadStudentAndSubjectOptions() {
        const students = await fetchJson('/api/students');
        const subjects = await fetchJson('/api/subjects');
        document.getElementById('studentSelect').innerHTML = '<option value="">Select Student</option>' + students.map((s) => `<option value="${s.id}">${s.name} (${s.roll_no})</option>`).join('');
        document.getElementById('subjectSelect').innerHTML = '<option value="">Select Subject</option>' + subjects.map((s) => `<option value="${s.id}">${s.subject_name}</option>`).join('');
      }

      async function loadMarks() {
        try {
          const data = await fetchJson('/api/marks');
          if (!data.length) {
            document.getElementById('marksTableBody').innerHTML = '<tr><td colspan="7" class="empty-state">No marks entered yet.</td></tr>';
            return;
          }

          document.getElementById('marksTableBody').innerHTML = data.map((row) => `
            <tr>
              <td>${row.student_name}</td><td>${row.roll_no}</td><td>${row.subject_name}</td><td>${row.marks_obtained}</td><td>${row.max_marks}</td><td>${row.percentage}%</td>
              <td><div class="table-actions"><button class="action-btn edit-mark" data-id="${row.id}">Edit</button><button class="danger-btn delete-mark" data-id="${row.id}">Delete</button></div></td>
            </tr>
          `).join('');

          document.querySelectorAll('.edit-mark').forEach((button) => button.addEventListener('click', () => editMark(button.dataset.id)));
          document.querySelectorAll('.delete-mark').forEach((button) => button.addEventListener('click', () => deleteMark(button.dataset.id)));
        } catch (error) {
          setMessage(document.getElementById('marksMessage'), error.message, 'error');
        }
      }

      async function editMark(id) {
        try {
          const data = await fetchJson('/api/marks');
          const mark = data.find((item) => String(item.id) === String(id));
          if (!mark) return;
          document.getElementById('studentSelect').value = mark.student_id;
          document.getElementById('subjectSelect').value = mark.subject_id;
          document.getElementById('marksObtained').value = mark.marks_obtained;
          setMessage(document.getElementById('marksMessage'), 'Edit the selected marks and save.', 'success');
        } catch (error) {
          setMessage(document.getElementById('marksMessage'), error.message, 'error');
        }
      }

      async function deleteMark(id) {
        const confirmed = window.confirm('Delete this marks record?');
        if (!confirmed) return;
        try {
          await fetchJson(`/api/marks/${id}`, { method: 'DELETE' });
          setMessage(document.getElementById('marksMessage'), 'Marks record deleted successfully.', 'success');
          loadMarks();
        } catch (error) {
          setMessage(document.getElementById('marksMessage'), error.message, 'error');
        }
      }

      document.getElementById('marksForm').addEventListener('submit', async (event) => {
        event.preventDefault();
        const payload = {
          student_id: Number(document.getElementById('studentSelect').value),
          subject_id: Number(document.getElementById('subjectSelect').value),
          marks_obtained: Number(document.getElementById('marksObtained').value)
        };
        try {
          await fetchJson('/api/marks', { method: 'POST', body: JSON.stringify(payload) });
          document.getElementById('marksForm').reset();
          setMessage(document.getElementById('marksMessage'), 'Marks saved successfully.', 'success');
          loadMarks();
        } catch (error) {
          setMessage(document.getElementById('marksMessage'), error.message, 'error');
        }
      });

      async function initializePage() {
        await loadStudentAndSubjectOptions();
        await loadMarks();
      }

      initializePage();
    </script>
  </body>
</html>
