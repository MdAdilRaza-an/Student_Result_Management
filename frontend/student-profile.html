<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Profile</title>
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body>
    <div class="student-shell">
      <header class="student-topbar">
        <div><strong>Student Portal</strong></div>
        <nav class="student-nav">
          <a href="student-dashboard.html">Dashboard</a>
          <a class="active" href="student-profile.html">My Profile</a>
          <a href="student-subjects.html">My Subjects</a>
          <a href="student-marks.html">My Marks</a>
          <a href="student-result.html">My Result</a>
        </nav>
        <button id="logoutBtn" class="secondary-btn" style="width:auto; padding:8px 12px;">Logout</button>
      </header>

      <main class="student-content">
        <div class="student-page-card">
          <h1>My Profile</h1>
          <form id="profileForm">
            <div class="student-profile-grid">
              <div class="form-group">
                <label for="name">Full Name</label>
                <input id="name" type="text" required />
              </div>
              <div class="form-group">
                <label for="email">Email</label>
                <input id="email" type="email" required />
              </div>
              <div class="form-group">
                <label for="phone">Phone</label>
                <input id="phone" type="tel" required />
              </div>
              <div class="form-group">
                <label for="rollNo">Roll Number</label>
                <input id="rollNo" type="text" readonly />
              </div>
              <div class="form-group">
                <label for="section">Section</label>
                <input id="section" type="text" required />
              </div>
              <div class="form-group">
                <label for="course">Course</label>
                <input id="course" type="text" required />
              </div>
              <div class="form-group">
                <label for="semester">Semester</label>
                <input id="semester" type="text" required />
              </div>
            </div>
            <div style="margin-top: 18px; max-width: 220px;">
              <button type="submit" class="primary-btn">Save Profile</button>
            </div>
          </form>
          <div id="profileMessage" class="message"></div>
        </div>
      </main>
    </div>

    <script src="./config.js"></script>
    <script src="./js/auth.js"></script>
    <script>
      redirectIfNotAuthenticated({ role: 'STUDENT', loginPage: 'student-login.html' });

      const logoutBtn = document.getElementById('logoutBtn');
      logoutBtn.addEventListener('click', () => {
        clearAuthToken();
        window.location.href = 'student-login.html';
      });

      async function loadProfile() {
        try {
          const data = await fetchJson('/api/student/profile');
          document.getElementById('name').value = data.name || '';
          document.getElementById('email').value = data.email || '';
          document.getElementById('phone').value = data.phone || '';
          document.getElementById('rollNo').value = data.roll_no || '';
          document.getElementById('section').value = data.section || '';
          document.getElementById('course').value = data.course || '';
          document.getElementById('semester').value = data.semester || '';
          setAuthUser(data);
        } catch (error) {
          setMessage(document.getElementById('profileMessage'), error.message, 'error');
        }
      }

      document.getElementById('profileForm').addEventListener('submit', async (event) => {
        event.preventDefault();
        const payload = {
          name: document.getElementById('name').value.trim(),
          email: document.getElementById('email').value.trim(),
          phone: document.getElementById('phone').value.trim(),
          section: document.getElementById('section').value.trim(),
          course: document.getElementById('course').value.trim(),
          semester: document.getElementById('semester').value.trim(),
        };

        try {
          const response = await fetchJson('/api/student/profile', {
            method: 'PUT',
            body: JSON.stringify(payload),
          });
          setMessage(document.getElementById('profileMessage'), response.message, 'success');
          await loadProfile();
        } catch (error) {
          setMessage(document.getElementById('profileMessage'), error.message, 'error');
        }
      });

      loadProfile();
    </script>
  </body>
</html>
