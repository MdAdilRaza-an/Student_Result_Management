<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Portal Login</title>
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body class="auth-body student-auth-body">
    <div class="auth-container">
      <div class="auth-header">
        <span class="eyebrow">Student Portal</span>
        <h1>Welcome back</h1>
        <p>Login to view your academic results</p>
      </div>

      <form id="loginForm">
        <div class="form-group">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" placeholder="student@example.com" required />
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" placeholder="Enter your password" required />
        </div>

        <button type="submit" class="primary-btn">Login</button>
      </form>

      <div class="auth-links">
        <a href="student-signup.html">Create account</a>
        <a href="index.html">Back to Admin Portal</a>
      </div>

      <div id="loginMessage" class="message"></div>
    </div>

    <script src="./config.js"></script>
    <script src="./js/auth.js"></script>
    <script>
      const user = getAuthUser();
      if (getAuthToken() && user.role === 'STUDENT') {
        window.location.href = 'student-dashboard.html';
      }

      document.getElementById('loginForm').addEventListener('submit', async (event) => {
        event.preventDefault();
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;
        const messageBox = document.getElementById('loginMessage');

        try {
          setMessage(messageBox, 'Signing in...', 'success');
          const data = await fetchJson('/api/auth/student/login', {
            method: 'POST',
            body: JSON.stringify({ email, password }),
          });

          setAuthToken(data.token);
          setAuthUser(data.student);
          setMessage(messageBox, 'Login successful. Redirecting...', 'success');
          setTimeout(() => {
            window.location.href = 'student-dashboard.html';
          }, 500);
        } catch (error) {
          setMessage(messageBox, error.message, 'error');
        }
      });
    </script>
  </body>
</html>
