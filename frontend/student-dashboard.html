<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Dashboard</title>
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body>
    <div class="student-shell">
      <header class="student-topbar">
        <div><strong>Student Portal</strong></div>
        <nav class="student-nav">
          <a class="active" href="student-dashboard.html">Dashboard</a>
          <a href="student-profile.html">My Profile</a>
          <a href="student-subjects.html">My Subjects</a>
          <a href="student-marks.html">My Marks</a>
          <a href="student-result.html">My Result</a>
        </nav>
        <button id="logoutBtn" class="secondary-btn" style="width:auto; padding:8px 12px;">Logout</button>
      </header>

      <main class="student-content">
        <div class="student-page-card">
          <h1 id="welcomeMessage">Welcome, Student</h1>
          <p id="studentSummary" class="text-muted">Loading student information...</p>

          <div class="student-grid" style="margin-top: 22px;">
            <div class="student-card">
              <h3>Roll Number</h3>
              <p id="rollNumber" class="value">-</p>
            </div>
            <div class="student-card">
              <h3>Course</h3>
              <p id="courseName" class="value">-</p>
            </div>
            <div class="student-card">
              <h3>Semester</h3>
              <p id="semesterValue" class="value">-</p>
            </div>
            <div class="student-card">
              <h3>Total Subjects</h3>
              <p id="totalSubjects" class="value">0</p>
            </div>
            <div class="student-card">
              <h3>Total Marks</h3>
              <p id="totalMarks" class="value">0</p>
            </div>
            <div class="student-card">
              <h3>Maximum Marks</h3>
              <p id="maximumMarks" class="value">0</p>
            </div>
            <div class="student-card">
              <h3>Percentage</h3>
              <p id="percentage" class="value">0%</p>
            </div>
            <div class="student-card">
              <h3>Grade</h3>
              <p id="grade" class="value">-</p>
            </div>
            <div class="student-card">
              <h3>Status</h3>
              <p id="status" class="value">-</p>
            </div>
          </div>
        </div>
      </main>
    </div>

    <script src="./config.js"></script>
    <script src="./js/auth.js"></script>
    <script>
      redirectIfNotAuthenticated({ role: 'STUDENT', loginPage: 'student-login.html' });

      const logoutBtn = document.getElementById('logoutBtn');
      logoutBtn.addEventListener('click', () => {
        clearAuthToken();
        window.location.href = 'student-login.html';
      });

      async function loadDashboard() {
        try {
          const studentProfile = await fetchJson('/api/auth/student/me');
          const dashboard = await fetchJson('/api/student/dashboard');
          setAuthUser(studentProfile.student);

          document.getElementById('welcomeMessage').textContent = `Welcome, ${dashboard.name}`;
          document.getElementById('studentSummary').textContent = `Email: ${dashboard.email} • Phone: ${dashboard.phone} • Section: ${dashboard.section}`;
          document.getElementById('rollNumber').textContent = dashboard.roll_no || '-';
          document.getElementById('courseName').textContent = dashboard.course || '-';
          document.getElementById('semesterValue').textContent = dashboard.semester || '-';
          document.getElementById('totalSubjects').textContent = dashboard.total_subjects || 0;
          document.getElementById('totalMarks').textContent = dashboard.total_marks || 0;
          document.getElementById('maximumMarks').textContent = dashboard.maximum_marks || 0;
          document.getElementById('percentage').textContent = `${dashboard.percentage || 0}%`;
          document.getElementById('grade').textContent = dashboard.grade || 'F';
          document.getElementById('status').textContent = dashboard.result_status || 'FAIL';
        } catch (error) {
          console.error(error);
          document.getElementById('studentSummary').textContent = error.message;
        }
      }

      loadDashboard();
    </script>
  </body>
</html>
